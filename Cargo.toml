[workspace]
# The core in vendor/buccanet keeps its own workspace.
exclude = ["vendor"]

[package]
name = "buccanet-relay"
description = "Buccanet relay: orders and queues MLS ciphertext between devices. Never reads content."
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/buccanet/buccanet-relay"
rust-version = "1.91"

[[bin]]
name = "buccanet-relay"
path = "src/main.rs"

[dependencies]
buccanet-protocol = { path = "vendor/buccanet/core/buccanet-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
futures = "0.3"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "fs", "trace"] }
mongodb = "3"
serde_bytes = "0.11"
async-stream = "0.3"
dashmap = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
